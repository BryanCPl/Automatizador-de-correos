<!DOCTYPE html>
    <html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Mi correo</title>
    </head>

    <body style="margin:0; padding:0; background:#f4f4f4;">

        <!-- Contenedor principal -->
        <table
            width="100%"
            cellpadding="0"
            cellspacing="0"
            border="0"
            role="presentation"
        >
            <tr>
                <td align="center">

                    <!-- Contenido del correo -->
                    <table
                        width="600"
                        cellpadding="0"
                        cellspacing="0"
                        border="0"
                        role="presentation"
                        style="max-width:600px; width:100%; background:#ffffff;"
                    >

                        <!-- Encabezado -->
                        <tr>
                            <td style="padding:30px; text-align:center;">
                                <h1>Mi empresa</h1>
                            </td>
                        </tr>

                        <!-- Contenido -->
                        <tr>
                            <td style="padding:30px; font-family:Arial,sans-serif;">

                                <h2>Hola 👋 {nombre}</h2>

                                <p>
                                    Este es el contenido de nuestro correo. tienes un {descuento}% de descuento para {empresa}
                                </p>

                                <!-- Botón -->
                                <table
                                    cellpadding="0"
                                    cellspacing="0"
                                    border="0"
                                    role="presentation"
                                >
                                    <tr>
                                        <td
                                            style="
                                                background:#007bff;
                                                border-radius:5px;
                                            "
                                        >
                                            <a
                                                href="https://ejemplo.com"
                                                style="
                                                    display:inline-block;
                                                    padding:12px 24px;
                                                    color:#ffffff;
                                                    text-decoration:none;
                                                    font-family:Arial,sans-serif;
                                                "
                                            >
                                                Ver más
                                            </a>
                                        </td>
                                    </tr>
                                </table>

                            </td>
                        </tr>

                        <!-- Footer -->
                        <tr>
                            <td
                                style="
                                    padding:20px;
                                    text-align:center;
                                    font-family:Arial,sans-serif;
                                    font-size:12px;
                                    color:#666666;
                                "
                            >

                                <p>
                                    Recibiste este correo porque te suscribiste
                                    a nuestras comunicaciones.
                                </p>

                                <!-- Desuscripción -->
                                <p>
                                    <a
                                        href="https://ejemplo.com/unsubscribe"
                                        style="color:#666666;"
                                    >
                                        Desuscribirme
                                    </a>
                                </p>

                            </td>
                        </tr>

                    </table>

                </td>
            </tr>
        </table>

    </body>
</html>
